name: LeetCode Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Prepare dist
        run: mkdir -p dist

      - name: Generate LeetCode SVG
        uses: JustSong/leetcode-stats-action@master
        with:
          username: jia-shui-bu-fang-tang
          cn: true
          output: dist/leetcode.svg

      - name: Verify output
        run: ls -al dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
